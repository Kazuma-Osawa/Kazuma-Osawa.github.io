<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kazuma Osawa のアプリ</title>
<meta name="description" content="Kazuma Osawa が作った iPhone アプリの一覧です。各アプリのサポートとプライバシーポリシーはここから開けます。">
<style>
  :root { --bg:#fbfaf7; --fg:#222; --sub:#666; --card:#fff; --line:#e4e1da; --link:#1a5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --fg:#eee; --sub:#aaa; --card:#222326; --line:#34363a; --link:#7fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height:1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 28px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li a { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--card);
         border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
  li a:hover { border-color: var(--link); }
  li img, li .noicon { width:56px; height:56px; border-radius:13px; flex:none; background:var(--line); }
  li strong { display:block; font-size:1.05rem; }
  li span { color: var(--sub); font-size: .9rem; }
  footer { margin-top: 36px; color: var(--sub); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Kazuma Osawa のアプリ</h1>
  <p class="lead">個人で作っている iPhone アプリです。使い方・お問い合わせ・プライバシーポリシーは、各アプリのページにあります。</p>

  <ul>
    <li><a href="bikedash/"><img src="bikedash/app-icon.svg" alt=""><div><strong>BikeDash ライドログ</strong><span>走りを記録するダッシュボード</span></div></a></li>
    <li><a href="rengatank-support/"><div class="noicon"></div><div><strong>レンガ工兵</strong><span>掘って、積んで、コアを守れ</span></div></a></li>
    <li><a href="blockpuzzle/"><img src="blockpuzzle/app-icon.png" alt=""><div><strong>ブロックパズル - 格言あつめ</strong><span>列をそろえて消す、格言あつめのパズル</span></div></a></li>
    <li><a href="rakugaki/"><img src="rakugaki/app-icon.png" alt=""><div><strong>らくがき迎撃隊</strong><span>ノートのらくがきを撃ち落とせ</span></div></a></li>
    <li><a href="pickleball-score/"><img src="pickleball-score/app-icon.png" alt=""><div><strong>ピックル点数係</strong><span>ピックルボールの点数コールと組み合わせ表</span></div></a></li>
    <li><a href="manindensha/"><img src="manindensha/app-icon.png" alt=""><div><strong>満員電車パズル</strong><span>変な形の乗客を、発車ベルまでに押し込もう</span></div></a></li>
  </ul>

  <footer>© 2026 Kazuma Osawa</footer>
</main>
</body>
</html>
